services:
  db:
    # 운영(Supabase)이 Postgres 17 이다. 메이저 버전을 맞춰 로컬에서만 통과하는 SQL 을 막는다
    image: postgres:17-alpine
    container_name: ayuta-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: ayuta
      POSTGRES_PASSWORD: ayuta
      POSTGRES_DB: ayuta
    ports:
      - '55432:5432'
    volumes:
      - ayuta-pgdata:/var/lib/postgresql/data

volumes:
  ayuta-pgdata:
